<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الصفحة غير موجودة | 404</title>
  <meta name="robots" content="noindex" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; padding: 0; min-height: 100vh; font-family: 'Cairo', system-ui, sans-serif; background: #FBF7F2; color: #2A1F1F; }
    .wrap { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; }
    .code { font-size: 96px; font-weight: 800; color: #B07F7F; margin: 0; line-height: 1; }
    h1 { margin: 16px 0 8px; font-size: 28px; font-weight: 700; }
    p { margin: 0 0 24px; font-size: 16px; color: #5A4A4A; max-width: 480px; }
    a.btn { display: inline-block; padding: 12px 28px; background: #B07F7F; color: #FBF7F2; text-decoration: none; border-radius: 999px; font-weight: 700; font-size: 15px; }
    a.btn:hover { background: #946464; }
  </style>
</head>
<body>
  <main class="wrap">
    <p class="code">404</p>
    <h1>الصفحة غير موجودة</h1>
    <p>الرابط الذي تبحث عنه غير متاح. ارجع إلى الصفحة الرئيسية لتصفح كولكشن نيمف عباية.</p>
    <a class="btn" href="/">العودة للرئيسية</a>
  </main>
</body>
</html>
